[package]
name = "worldsmith-engine"
description = "Pipeline runner, scheduler, time, configuration, and logging"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
worldsmith-math = { path = "../worldsmith-math" }
worldsmith-units = { path = "../worldsmith-units" }
worldsmith-rng = { path = "../worldsmith-rng" }
worldsmith-models = { path = "../worldsmith-models" }
worldsmith-state = { path = "../worldsmith-state" }
worldsmith-traits = { path = "../worldsmith-traits" }

[dev-dependencies]
worldsmith-evolution = { path = "../worldsmith-evolution" }
worldsmith-stellar = { path = "../worldsmith-stellar" }
worldsmith-planet = { path = "../worldsmith-planet" }
worldsmith-visualization = { path = "../worldsmith-visualization" }
criterion = "0.5"

[[bench]]
name = "engine_benches"
harness = false
